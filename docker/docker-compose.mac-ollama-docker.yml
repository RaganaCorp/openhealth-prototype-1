# OpenHealth — macOS, Ollama running in Docker container
# Copied to project root as docker-compose.yml by install.sh

name: openhealth

networks:
  openhealth_net:
    driver: bridge

volumes:
  ollama_data:

services:
  frontend:
    image: ghcr.io/raganacorp/openhealth-prototype1-frontend:${OPENHEALTH_PROTOTYPE1_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Note: the /api/backend rewrite is baked into the image at build time;
      # this runtime value only documents the target (it matches the build ARG).
      - BACKEND_API_URL=http://backend:8000
    networks:
      - openhealth_net
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/raganacorp/openhealth-prototype1-backend:${OPENHEALTH_PROTOTYPE1_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATA_PATH=/data
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/data
    networks:
      - openhealth_net
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - openhealth_net
    restart: unless-stopped
