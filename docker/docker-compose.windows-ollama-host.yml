# OpenHealth — Windows, Ollama running on host machine
# Copied to project root as docker-compose.yml by install.ps1

name: openhealth

networks:
  openhealth_net:
    driver: bridge

services:
  frontend:
    image: ghcr.io/raganacorp/openhealth-prototype1-frontend:${OPENHEALTH_PROTOTYPE1_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_API_URL=http://backend:8000
    networks:
      - openhealth_net
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/raganacorp/openhealth-prototype1-backend:${OPENHEALTH_PROTOTYPE1_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATA_PATH=/data
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/data
    networks:
      - openhealth_net
    restart: unless-stopped
