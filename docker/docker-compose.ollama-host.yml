# OpenHealth — Ollama running natively on the host (Windows, macOS, or Linux)
# Copied to the project root as docker-compose.yml by install.ps1 / install.sh.
#
# Ollama is expected on the host at localhost:11434 so it can use the GPU. A
# container on Windows/macOS gets no GPU access (CPU-only), which is far too slow
# for these models — hence host Ollama is the only supported configuration.

name: openhealth

networks:
  openhealth_net:
    driver: bridge

services:
  frontend:
    image: ghcr.io/raganacorp/openhealth-prototype1-frontend:${OPENHEALTH_PROTOTYPE1_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Note: the /api/backend rewrite is baked into the image at build time;
      # this runtime value only documents the target (it matches the build ARG).
      - BACKEND_API_URL=http://backend:8000
    networks:
      - openhealth_net
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/raganacorp/openhealth-prototype1-backend:${OPENHEALTH_PROTOTYPE1_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATA_PATH=/data
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/data
    networks:
      - openhealth_net
    # Maps host.docker.internal to the host gateway on Linux; harmless on Docker
    # Desktop (Windows/macOS), where the name is already predefined.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
